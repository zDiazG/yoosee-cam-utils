<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera viewer</title>
<link rel="stylesheet" href="/style.css">
<main>
  <header><div><h1>Camera viewer</h1><p>Local live video. No cloud uploads.</p></div><output id="status" aria-live="polite">Loading cameras...</output></header>
  <section class="toolbar" aria-label="Camera actions">
    <label>All cameras <select id="bulk-action"><option value="">Choose action</option><option value="start">Start all</option><option value="stop">Stop all</option></select></label>
    <button id="apply-action">Apply</button>
    <label>All-camera quality <select id="bulk-quality"><option value="fhd">Full HD when available</option><option value="light">Lightest available</option></select></label>
    <button id="apply-quality">Apply quality to all</button>
    <label class="check"><input id="autostart" type="checkbox"> Start Full HD on page load</label>
  </section>
  <section id="camera-grid" class="camera-grid" aria-label="Configured cameras"></section>
  <section class="controls">
    <h2>PTZ controls</h2>
    <label>Selected camera <select id="selected-camera"></select></label>
    <label class="duration" for="ptz-duration">Movement per click</label>
    <input id="ptz-duration" type="range" min="0.2" max="1" step="0.1" value="0.8">
    <output id="ptz-duration-value">0.8 s</output>
    <div class="ptz" aria-label="Pan and tilt">
      <button data-pan="0" data-tilt="0.25" aria-label="Tilt up">↑</button>
      <div><button data-pan="-0.25" data-tilt="0" aria-label="Pan left">←</button><button id="ptz-stop">Stop</button><button data-pan="0.25" data-tilt="0" aria-label="Pan right">→</button></div>
      <button data-pan="0" data-tilt="-0.25" aria-label="Tilt down">↓</button>
    </div>
    <p>FPS and dimensions are measured from the current source segment. The delay readout is player delay behind the HLS edge, not camera-to-screen latency.</p>
  </section>
</main>
<script src="/vendor/hls.min.js"></script>
<script src="/app.js"></script>
</html>
